services:
  app:
    build: .
    depends_on:
      - db
    ports:
      - "8081:8080"

  db:
    build: ./docs/
    environment:
    # Use the values from the .env file in the same folder, and fail if they are not set.
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    # Named volume: persists Postgres data across 'docker compose down' and
    # 'docker compose up'. Use 'docker compose down -v' to also remove this
    # volume, which wipes the database and starts fresh on the next 'up'.
