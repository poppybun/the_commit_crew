services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

  db:
    build: 
      context: ./db
      args:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    environment:
    # Use the values from the .env file passed via --env-file flag in Jenkinsfile
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
    # Named volume: persists Postgres data across 'docker compose down' and
    # 'docker compose up'. Use 'docker compose down -v' to also remove this
    # volume, which wipes the database and starts fresh on the next 'up'.
